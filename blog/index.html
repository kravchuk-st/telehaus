<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="shortcut icon" type="image/ico" href="../assets/img/favicon.svg" />

    <link rel="stylesheet" href="../assets/css/normalize.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="wrapper">
        <a href="../" class="logo">
          <img class="logo__img" src="../assets/img/logo.svg" alt="Logo img" width="220" />
        </a>
        <nav class="nav">
          <ol class="nav__list list-reset">
            <li class="nav__item">
              <a href="../#about" class="nav__link">Послуги</a>
            </li>
            <li class="nav__item">
              <a href="../#why" class="nav__link">Чому ми?</a>
            </li>
            <li class="nav__item">
              <a href="../#portfolio" class="nav__link">Портфоліо</a>
            </li>
            <li class="nav__item">
              <a href="../#comments" class="nav__link">Відгуки</a>
            </li>
          </ol>
          <a href="#form" class="btn nav__btn btn-reset">Консультація</a>
        </nav>
        <a href="#form" class="btn btn-lg btn-reset">Консультація</a>
        <button class="burger btn-reset" aria-label="Відкрити меню">
          <span class="burger__line" aria-hidden="true"></span>
          <span class="burger__line" aria-hidden="true"></span>
          <span class="burger__line" aria-hidden="true"></span>
        </button>
        <span class="overlay"></span>
      </div>
    </header>

    <main>
      <section class="banner">
        <div class="wrapper"></div>
      </section>

      <section class="request" id="form">
        <div class="wrapper">
          <div class="request__contacts">
            <a href="../" class="logo btn-reset">
              <img class="contacts__logo" src="../assets/img/logo.svg" alt="Logo" width="308" />
            </a>
            <h2 class="contacts__title">Контакти</h2>
            <div class="contacts__phones">
              <a href="tel:+380501234567" class="contacts__link contacts__number">+38 050 123 45 67</a>
              <a href="tel:+48255123456" class="contacts__link contacts__number">+48 255 123 456</a>
            </div>
            <a href="mailto:telehausme@gmail.com" class="contacts__link contacts__email">telehausme@gmail.com</a>
            <a
              href="https://maps.app.goo.gl/EVT97LwBF92cj2ki7"
              class="contacts__link"
              target="_blank"
              rel="noopener noreferrer"
              >м. Київ, вул. Братська 7</a
            >
            <ul class="contacts__social list-reset">
              <li class="social__item">
                <a
                  href="#"
                  class="social__link social__link_ig"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Перейти до Instagram"
                  title="Instagram"
                ></a>
              </li>
              <li class="social__item">
                <a
                  href="#"
                  class="social__link social__link_in"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Перейти до LinkedIn"
                  title="LinkedIn"
                ></a>
              </li>
              <li class="social__item">
                <a
                  href="#"
                  class="social__link social__link_fb"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Перейти до Facebook"
                  title="Facebook"
                ></a>
              </li>
            </ul>
            <hr class="contacts__line" />
            <p class="contacts__copy">&copy; Telehaus 2025</p>
          </div>
          <form class="request__form" action="#" method="post">
            <div class="form__row">
              <label for="name">Введіть ваше ім’я:</label>
              <input name="Ім'я" type="text" id="name" data-validate-field="name" />
            </div>
            <div class="form__row">
              <label for="email">Введіть ваш email:</label>
              <input
                name="E-mail"
                type="email"
                id="email"
                placeholder="example@gmail.com"
                data-validate-field="email"
              />
            </div>
            <div class="form__row">
              <label for="service">Оберіть послугу</label>
              <select name="Послуга" id="service">
                <option value="Організація конференції">Організація конференції</option>
              </select>
            </div>
            <div class="form__row">
              <label for="descr">Коротко опишіть ваш запит</label>
              <textarea name="Опис" id="descr" cols="30" rows="4"></textarea>
            </div>
            <div class="form__btns">
              <button class="btn btn-dark form__btn btn-reset" type="submit">
                Залишити заявку
                <svg class="btn__icon" aria-hidden="true">
                  <use xlink:href="#arrow-btn"></use>
                </svg>
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
